name: Build and Push Docker Images from Monorepo

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout del monorepo
      - uses: actions/checkout@v4

      # 2️⃣ Login en GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      # 3️⃣ Build y push de mf-host
      - name: Build and push mf-host
        run: |
          docker build \
            --build-arg MF_CHARACTER=${{ secrets.MF_CHARACTER }} \
            --build-arg MF_CHARACTER_DETAIL=${{ secrets.MF_CHARACTER_DETAIL }} \
            -t ghcr.io/stewiemayer/mf-host:latest ./mf-host \
          docker push ghcr.io/stewiemayer/mf-host:latest

      # 4️⃣ Build y push de mf-character
      - name: Build and push mf-character
        run: |
          docker build -t ghcr.io/stewiemayer/mf-character:latest ./mf-character
          docker push ghcr.io/stewiemayer/mf-character:latest

      # 5️⃣ Build y push de mf-character-detail
      - name: Build and push mf-character-detail
        run: |
          docker build -t ghcr.io/stewiemayer/mf-character-detail:latest ./mf-character-detail
          docker push ghcr.io/stewiemayer/mf-character-detail:latest

      # 6️⃣ Trigger deploy en Render
      - name: Deploy to Render
        run: | 
          curl -X POST "https://api.render.com/deploy/${{ secrets.RENDER_HOST_ID }}" -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" 
          curl -X POST "https://api.render.com/deploy/${{ secrets.RENDER_CHARACTER_ID }}" -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"
          curl -X POST "https://api.render.com/deploy/${{ secrets.RENDER_CHARACTER_DETAIL_ID }}" -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"
