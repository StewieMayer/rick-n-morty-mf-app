name: Build and Push Docker Images from Monorepo

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout del monorepo
      - uses: actions/checkout@v4

      # 2️⃣ Login en GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Install docker-compose
        run: sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
      
      - name: Set permissions for docker-compose
        run: sudo chmod +x /usr/local/bin/docker-compose

      #  Build doker-compose
      - name: Build docker-compose
        run: |
          export MF_CHARACTER=${{ secrets.MF_CHARACTER }}
          export MF_CHRACTER_DETAIL=${{ secrets.MF_CHRACTER_DETAIL }}
          docker-compose build --no-cache

      - name: Tag
        run: |    
          docker tag mf-host ghcr.io/stewiemayer/mf-host:latest
          docker tag mf-character ghcr.io/stewiemayer/mf-character:latest
          docker tag mf-character-detail ghcr.io/stewiemayer/mf-character-detail:latest

      - name: Push images to GHCR
        run: |
          docker push ghcr.io/stewiemayer/mf-host:latest
          docker push ghcr.io/stewiemayer/mf-character:latest
          docker push ghcr.io/stewiemayer/mf-character-detail:latest

      # 6️⃣ Trigger deploy en Render
      - name: Deploy to Render
        run: | 
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_HOST }}/deploys" \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_CHARACTER }}/deploys" \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_CHARACTER_DETAIL }}/deploys" \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"
